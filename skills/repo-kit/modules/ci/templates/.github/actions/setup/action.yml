name: Setup
description: Installs Node and {%pm%}, then the dependencies from the lockfile.

inputs:
  install:
    description: "frozen installs the dependencies exactly as the lockfile pins them; none sets up the toolchain only."
    required: false
    default: frozen

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        case "$INSTALL" in
          frozen | none) ;;
          *) echo "::error::install must be frozen or none, got '$INSTALL'"; exit 1 ;;
        esac

    - name: Find the Node version file
      id: node-version
      shell: bash
      run: |
        for file in .nvmrc .node-version; do
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "version={%nodeVersion%}" >> "$GITHUB_OUTPUT"

{%if pnpm%}
    # Reads the pnpm version from the packageManager field in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

{%endif%}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        node-version-file: ${{ steps.node-version.outputs.file }}
        package-manager-cache: false

{%if bun%}
    # Reads the Bun version from packageManager or engines.bun in package.json, else installs the latest.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

{%endif%}
    - name: Install dependencies
      if: inputs.install == 'frozen'
      shell: bash
      run: {%installFrozen%}
